name: release-debs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the .debs to
        required: true
permissions:
  contents: write
jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, arch: arm64 }
          - { runner: ubuntu-24.04, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc g++ make pkg-config cmake \
            libfontconfig1-dev libfreetype-dev libclang-dev dpkg-dev gh
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build .deb (optimized release build)
        run: |
          cargo install cargo-deb --locked
          cargo deb -p zanon-camera-desktop -o "zanon-camera_${{ inputs.tag || github.event.release.tag_name }}_${{ matrix.arch }}.deb"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag || github.event.release.tag_name }}" zanon-camera_*.deb --clobber --repo "${{ github.repository }}"
